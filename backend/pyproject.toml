[project]
name = "studylens"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "chromadb>=0.5",
    "sqlmodel>=0.0.19",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "trafilatura>=1.9",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studylens"]
