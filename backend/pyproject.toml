[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "examlens-api"
version = "0.1.0"
description = "Local-first exam-oriented document study assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "pypdf>=5.0.0",
  "pymupdf>=1.24.0",
  "python-docx>=1.1.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

